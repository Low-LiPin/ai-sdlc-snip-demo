# .github/workflows/docker.yml
#
# Builds and pushes the Docker image to GHCR whenever a new bundle release is
# pinned on main (i.e., the bundle submodule pointer is bumped) or this file changes.
#
# Why paths: [bundle] and NOT paths: [bundle/**]?
#   `bundle` is a git *submodule gitlink* (mode 160000), not a regular directory.
#   Only the pointer entry is tracked by the superproject — the actual files live
#   inside the submodule repo.  `bundle/**` would never match a gitlink change.

name: Build and push image

on:
  push:
    branches: [main]
    paths:
      - bundle                           # submodule pointer bump
      - .github/workflows/docker.yml     # workflow file itself
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./bundle
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
